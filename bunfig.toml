[install]
# Preserve each workspace's declared dependencies, including the docs app's local Tailwind sources.
linker = "isolated"
# Match the SDK's supply-chain protection for every workspace installation.
minimumReleaseAge = 259200

[test]
# Keep direct `bun test` at the workspace root consistent with the SDK's test setup.
preload = ["./packages/hyperliquid/tests/_noCloseEvent.ts"]
coveragePathIgnorePatterns = ["packages/hyperliquid/tests/**", "packages/hyperliquid/.dev/**", "apps/**"]
