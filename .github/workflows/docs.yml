name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "apps/docs/**"
      - "packages/hyperliquid/README.md"
      - "packages/hyperliquid/package.json"
      - ".github/CODEOWNERS"
      - ".github/workflows/docs.yml"
      - ".lycheeignore"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
  pull_request:
    paths:
      - "README.md"
      - "apps/docs/**"
      - "packages/hyperliquid/README.md"
      - "packages/hyperliquid/package.json"
      - ".github/CODEOWNERS"
      - ".github/workflows/docs.yml"
      - ".lycheeignore"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    # Release scan, parallel with docs. Skipped on PRs.
    if: github.event_name != 'pull_request'
    uses: bloxwap/.github/.github/workflows/security-scan.yml@90c5e7f20cef611a83ea7db51f9b85478d714fa6 # v1
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  docs:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      # Project Pages is served from /<repository>; PR builds use the same paths.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Job-level env cannot use the runner context on these Mac minis.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-bun writes ~/.bun, shared across runner instances on one Mac mini.
      - name: Install Bun canary into runner temp
        run: sh .github/scripts/setup-bun-isolated.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check documentation structure and formatting
        run: bun run check:docs

      - name: Check documentation website types
        working-directory: apps/docs
        run: bun run check

      - name: Test documentation website helpers
        working-directory: apps/docs
        run: bun run test

      - name: Build static documentation website
        working-directory: apps/docs
        run: bun run build

      # `--with-deps` is apt/sudo on Linux. Chromium's macOS deps ship with the OS.
      - name: Install browser for documentation checks
        working-directory: apps/docs
        run: bunx playwright install chromium

      - name: Test production documentation interactions
        working-directory: apps/docs
        run: bun run test:browser

      # lychee-action downloads only `*-unknown-linux-gnu` and uses GNU `install -t`.
      # Same lychee v0.24.2 scan, installed into $RUNNER_TEMP for the Mac mini.
      - name: Check documentation links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          LYCHEE_VERSION=v0.24.2
          ARCHIVE=lychee-aarch64-apple-darwin.tar.gz
          EXPECTED_SHA256=c9d3740ea2d891854d37116c9fba840f37b6e7c89d330e7db84ac333631c4977
          DEST="$RUNNER_TEMP/lychee"
          mkdir -p "$DEST"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${ARCHIVE}" \
            -o "$DEST/$ARCHIVE"
          actual=$(shasum -a 256 "$DEST/$ARCHIVE")
          actual=${actual%% *}
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "lychee archive checksum mismatch: got $actual want $EXPECTED_SHA256" >&2
            exit 1
          fi
          tar -xzf "$DEST/$ARCHIVE" -C "$DEST"
          LYCHEE="$DEST/lychee-aarch64-apple-darwin/lychee"
          chmod +x "$LYCHEE"
          report="$RUNNER_TEMP/lychee-out.md"
          "$LYCHEE" \
            --root-dir . \
            --no-progress \
            --max-retries 3 \
            --timeout 20 \
            --format markdown \
            README.md \
            packages/hyperliquid/README.md \
            "apps/docs/content/docs/**/*.md" \
            | tee "$report"
          if grep -E 'Total[[:space:]]+\|[[:space:]]+0' "$report" >/dev/null; then
            echo "No links were found. This usually indicates a configuration error." >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/docs/out

  deploy:
    # Security: never run fork PR code on the self-hosted runner.
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [docs, security]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # Job-level env cannot use the runner context on these Mac minis.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Enable Settings > Pages > Source: GitHub Actions before the first deployment.
      # Keeping Pages API calls here lets PR checks run before Pages is enabled.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
