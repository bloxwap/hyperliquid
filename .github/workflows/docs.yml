name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "website/**"
      - ".dev/docs_check.ts"
      - ".github/CODEOWNERS"
      - ".github/workflows/docs.yml"
      - ".lycheeignore"
      - ".markdownlint-cli2.jsonc"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "website/**"
      - ".dev/docs_check.ts"
      - ".github/CODEOWNERS"
      - ".github/workflows/docs.yml"
      - ".lycheeignore"
      - ".markdownlint-cli2.jsonc"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Project Pages is served from /<repository>; PR builds use the same paths.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Match the rest of CI while Bun 1.4 remains canary-only.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check documentation structure and formatting
        run: bun run check:docs

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Check documentation website types
        working-directory: website
        run: bun run check

      - name: Build static documentation website
        working-directory: website
        run: bun run build

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --root-dir .
            --no-progress
            --max-retries 3
            --timeout 20
            README.md
            'docs/**/*.md'
          fail: true
          failIfEmpty: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # Enable Settings > Pages > Source: GitHub Actions before the first deployment.
      # Keeping Pages API calls here lets PR checks run before Pages is enabled.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
