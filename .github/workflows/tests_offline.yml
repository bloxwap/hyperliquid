name: Tests (offline)
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Everything after `--` is forwarded to the test files; `--offline` makes them skip live Hyperliquid endpoints.
      - name: bun test (offline)
        run: bun test tests/ -- --offline
