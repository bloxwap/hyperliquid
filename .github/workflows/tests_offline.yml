name: Tests (offline)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Bun 1.4 (the Rust rewrite) ships only as canary; the `canary` tag moves with each build.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs the same script contributors run, so CI and CONTRIBUTING.md cannot drift apart.
      # It sets HL_OFFLINE=1, which makes tests needing live Hyperliquid endpoints skip.
      #
      # `bun test tests/ -- --offline` also works: tests/_offline.ts recovers the raw command line
      # because `bun test` does not forward argv to test files. The env var is preferred here because
      # it needs no such recovery — that path reads /proc/self/cmdline on Linux and is exercised only
      # in CI, so relying on it would put the least-tested branch on the critical path.
      - name: bun test (offline)
        run: bun run test:offline
