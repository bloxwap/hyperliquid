name: Tests (offline)
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests_offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      # Skip doc-only PRs; SDK tests and performance scenarios do not read Markdown.
      # Non-PR events always run every heavy job, including reusable-workflow calls.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!CODEOWNERS'
              - '!.github/CODEOWNERS'

  test:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      # Job-level env cannot use the runner context on these Mac minis.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-bun writes ~/.bun, shared across runner instances on one Mac mini.
      - name: Install Bun canary into runner temp
        run: sh .github/scripts/setup-bun-isolated.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs the same root script contributors run; it delegates to packages/hyperliquid.
      # It sets HL_OFFLINE=1, which makes tests needing live Hyperliquid endpoints skip.
      #
      # Inside the SDK, `bun test tests/ -- --offline` also works: tests/_offline.ts recovers the raw command line
      # because `bun test` does not forward argv to test files. The env var is preferred here because
      # it needs no such recovery — that path reads /proc/self/cmdline on Linux or `ps` on Darwin
      # and is the least-tested branch, so it stays off the CI critical path.
      - name: bun test (offline)
        run: bun run test:offline
