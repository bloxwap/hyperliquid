# Runs ALONGSIDE build/test. Nothing in the deploy workflows needs: this.
name: security-pr

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: security-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true    # a new push to the same PR cancels the stale scan and frees the runner

jobs:
  gate:
    # Fork guard: never run fork PR code on self-hosted minis
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: bloxwap/.github/.github/workflows/security-pr-gate.yml@0387d86d796b5a80509a9862b35991a160ff13b4 # v1.0.1
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
