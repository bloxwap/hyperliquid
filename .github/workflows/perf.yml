name: Performance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Enforces the zero-performance-regression policy: a change may keep performance the same or
  # improve it, never regress it.
  #
  # WHY THIS MEASURES TWICE INSTEAD OF USING tests/perf/results/baseline.json:
  # the scenarios measure between 9 ns and 600 µs per unit. A GitHub-hosted runner is several times
  # slower than a developer machine, so comparing a committed baseline (recorded on whatever machine
  # last touched it) against a runner would flag nearly every scenario as a regression on every PR.
  # `.dev/perf/compare.ts` now refuses such a comparison outright. So this job measures the base
  # commit and the head commit back to back on the SAME runner and compares those two reports.
  # The committed baseline stays useful for local runs (`bun run perf:gate`) on one machine.
  #
  # Runners are shared and noisy even against themselves: a single pair of runs can be off by
  # tens of percent on microsecond scenarios (#36). So each revision is measured three times in
  # alternating order and the comparison uses each scenario's MINIMUM across its runs — runner
  # interference is one-sided (it only slows measurements), making the minimum the least-noise
  # estimate. The threshold plus each merged run's margin of error absorbs what variance remains.
  # If this job flaps, widen the threshold — do not add retries and do not drop the job.
  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base commit must be reachable so it can be checked out into a second worktree.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Bun 1.4 (the Rust rewrite) ships only as canary; the `canary` tag moves with each build.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each revision is measured 3 times in alternating order (H B B H H B), and the comparison
      # uses each scenario's MINIMUM across the 3 runs. On a shared runner interference only ever
      # makes a measurement slower, so the minimum is the least-noise estimate — single-run
      # comparisons flagged phantom regressions of +30…+200% on untouched scenarios (#36), and a
      # discarded warm-up run alone did not fix it. Alternating order cancels drift direction.
      - name: Measure this PR (round 1)
        run: bun run tests/perf/run.ts --label "head-1" --out "$RUNNER_TEMP/head-1.json"

      - name: Measure the base commit (rounds 1 and 2)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          # A base commit from before the perf suite existed has nothing to compare against.
          if [ ! -f tests/perf/run.ts ]; then
            echo "Base commit $BASE_SHA has no performance suite; skipping the comparison."
            exit 0
          fi
          bun install --frozen-lockfile
          bun run tests/perf/run.ts --label "base-1" --out "$RUNNER_TEMP/base-1.json"
          bun run tests/perf/run.ts --label "base-2" --out "$RUNNER_TEMP/base-2.json"

      - name: Measure this PR (rounds 2 and 3)
        run: |
          set -euo pipefail
          bun run tests/perf/run.ts --label "head-2" --out "$RUNNER_TEMP/head-2.json"
          bun run tests/perf/run.ts --label "head-3" --out "$RUNNER_TEMP/head-3.json"

      - name: Measure the base commit (round 3)
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/base/tests/perf/run.ts" ]; then
            cd "$RUNNER_TEMP/base"
            bun run tests/perf/run.ts --label "base-3" --out "$RUNNER_TEMP/base-3.json"
          fi

      - name: Compare
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/base-1.json" ]; then
            echo "No base measurement was produced; nothing to gate."
            exit 0
          fi
          bun run .dev/perf/minimize.ts "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/head-1.json" "$RUNNER_TEMP/head-2.json" "$RUNNER_TEMP/head-3.json"
          bun run .dev/perf/minimize.ts "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/base-1.json" "$RUNNER_TEMP/base-2.json" "$RUNNER_TEMP/base-3.json"
          bun run .dev/perf/compare.ts "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"
