name: Performance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Enforces the zero-performance-regression policy: a change may keep performance the same or
  # improve it, never regress it.
  #
  # WHY THIS MEASURES TWICE INSTEAD OF USING tests/perf/results/baseline.json:
  # the scenarios measure between 9 ns and 600 µs per unit. A GitHub-hosted runner is several times
  # slower than a developer machine, so comparing a committed baseline (recorded on whatever machine
  # last touched it) against a runner would flag nearly every scenario as a regression on every PR.
  # `.dev/perf/compare.ts` refuses such a comparison outright. So this job measures the base
  # commit and the head commit back to back on the SAME runner and compares those two reports.
  # The committed baseline stays useful for local runs (`bun run perf:gate`) on one machine.
  #
  # Runners are shared and noisy even against themselves: a single pair of runs can be off by
  # tens of percent on microsecond scenarios (#36). So the job measures THREE PAIRED ROUNDS —
  # round i writes head-i.json and base-i.json — with the two revisions measured back to back
  # and the order alternating between rounds: (head, base), (base, head), (head, base). Runner
  # load drifts over minutes, and a drift that slows a round slows BOTH revisions in it, so it
  # cancels in the per-round ratio; alternating the order cancels any trend within a round.
  # `.dev/perf/compare.ts` aggregates the per-round ratios with a median plus a conservative
  # between-round band and only flags a regression when the WHOLE band clears the threshold,
  # so one contaminated round widens the band instead of fabricating a regression.
  # The band is the median ± the maximum round deviation with per-side sampling margins on
  # top — a deliberately conservative heuristic, not a confidence interval.
  # The gate also fails closed when the perf SUITE itself differs between the revisions
  # (source fingerprint of scenarios/fixtures/helpers/harness): a PR editing tests/perf
  # changes the workload being compared and is flagged for explicit review, not waved through.
  # If this job flaps, widen the threshold — do not add retries and do not drop the job.
  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base commit must be reachable so it can be checked out into a second worktree.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Bun 1.4 (the Rust rewrite) ships only as canary; the `canary` tag moves with each build.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On pull_request, BASE_REF is the base commit SHA. On workflow_dispatch the pull_request
      # payload is absent, so the expression falls back to the default branch NAME — the script
      # resolves either form to a SHA before adding the worktree (an empty BASE_REF would make
      # `git worktree add` fail).
      - name: Check out the base commit into a worktree
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Prefer the remote-tracking ref: a stale local branch of the same name must not
          # win over origin's tip; a raw SHA has no origin/<sha> ref and falls through.
          BASE_SHA=$(git rev-parse --verify "origin/$BASE_REF^{commit}" 2>/dev/null || git rev-parse --verify "$BASE_REF^{commit}" 2>/dev/null) || {
            echo "Could not resolve BASE_REF '$BASE_REF' to a commit."
            exit 1
          }
          echo "Base: $BASE_REF -> $BASE_SHA"
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          # A base commit from before the perf suite existed has nothing to compare against;
          # the round steps then skip the base side and the Compare step passes the job.
          if [ -f "$RUNNER_TEMP/base/tests/perf/run.ts" ]; then
            cd "$RUNNER_TEMP/base"
            bun install --frozen-lockfile
          else
            echo "Base commit $BASE_SHA has no performance suite; skipping the comparison."
          fi

      # Paired rounds: each round measures both revisions back to back into round-numbered
      # files, alternating which revision runs first so within-round drift hits both sides.
      - name: Round 1 (head, then base)
        run: |
          set -euo pipefail
          bun run tests/perf/run.ts --label "head-1" --out "$RUNNER_TEMP/head-1.json"
          if [ -f "$RUNNER_TEMP/base/tests/perf/run.ts" ]; then
            cd "$RUNNER_TEMP/base"
            bun run tests/perf/run.ts --label "base-1" --out "$RUNNER_TEMP/base-1.json"
          fi

      - name: Round 2 (base, then head)
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/base/tests/perf/run.ts" ]; then
            cd "$RUNNER_TEMP/base"
            bun run tests/perf/run.ts --label "base-2" --out "$RUNNER_TEMP/base-2.json"
            cd "$GITHUB_WORKSPACE"
          fi
          bun run tests/perf/run.ts --label "head-2" --out "$RUNNER_TEMP/head-2.json"

      - name: Round 3 (head, then base)
        run: |
          set -euo pipefail
          bun run tests/perf/run.ts --label "head-3" --out "$RUNNER_TEMP/head-3.json"
          if [ -f "$RUNNER_TEMP/base/tests/perf/run.ts" ]; then
            cd "$RUNNER_TEMP/base"
            bun run tests/perf/run.ts --label "base-3" --out "$RUNNER_TEMP/base-3.json"
          fi

      - name: Compare
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/base-1.json" ]; then
            echo "No base measurement was produced; nothing to gate."
            exit 0
          fi
          # base-i pairs with head-i by position; the estimator is documented in compare.ts.
          # --allow-unfingerprinted-base is TRANSITION GRACE: base commits that predate
          # workload fingerprinting carry no fingerprints and would otherwise fail the
          # presence-parity check. Remove this flag once the base branch is guaranteed to
          # contain the fingerprinted suite (i.e. once this change is old).
          bun run .dev/perf/compare.ts \
            "$RUNNER_TEMP/base-1.json" "$RUNNER_TEMP/base-2.json" "$RUNNER_TEMP/base-3.json" \
            --vs \
            "$RUNNER_TEMP/head-1.json" "$RUNNER_TEMP/head-2.json" "$RUNNER_TEMP/head-3.json" \
            --allow-unfingerprinted-base
