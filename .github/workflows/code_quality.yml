name: Code Quality

on:
  pull_request:
  workflow_call:

concurrency:
  group: code_quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      # Markdown stays checked because bun run check includes check:docs; skip only other doc-only PRs.
      # Non-PR events always run every heavy job, including reusable-workflow calls.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!CODEOWNERS'
              - '!.github/CODEOWNERS'

  quality:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      # Job-level env cannot use the runner context on these Mac minis.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # setup-bun writes ~/.bun, shared across runner instances on one Mac mini.
      - name: Install Bun canary into runner temp
        run: sh .github/scripts/setup-bun-isolated.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deliberately one step invoking the aggregate script rather than a list of individual commands:
      # package.json calls `check` "everything CI gates on", and enumerating the steps here is how that
      # claim silently becomes false (it already had — the two sync gates below were missing entirely).
      #
      # The root `check` coordinates the workspace checks. The SDK's TypeScript 7 gate keeps
      # its own install tree under packages/hyperliquid/.dev/ts7 because TS7 ships a native
      # binary with no JS compiler API.
      - name: Check
        run: bun run check
