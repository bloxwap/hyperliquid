name: Code Quality

on:
  pull_request:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx biome format .

      - name: Lint
        run: bunx biome lint .

      - name: Type check (TypeScript 5)
        run: bunx tsc --project tsconfig.json

      # Forward-compatibility gate. TypeScript 7 ships as a native binary with no JS compiler API, so it lives in its
      # own install tree under .dev/ts7 and never joins the root dependency graph.
      - name: Type check (TypeScript 7)
        run: cd .dev/ts7 && bun install --frozen-lockfile && bunx tsc --project tsconfig.json
