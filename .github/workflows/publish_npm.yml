name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      # npm publishes via OIDC trusted publishing (no token here), which needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Emits dist/ with its own package.json whose exports point at the compiled .js/.d.ts files.
      - name: Build package
        run: bun run .dev/build/build.ts

      - name: Determine npm tag
        id: tag
        run: |
          # The emitted manifest inherits its version from the root package.json, so read it there.
          VERSION=$(jq -r .version package.json)
          # Extract tag (alpha, beta, rc) from version string if present
          TAG=$(echo "$VERSION" | sed -n 's/.*-\(alpha\|beta\|rc\).*/\1/p')
          # If no known tag found but version contains hyphen, use "prerelease"
          if [[ -z "$TAG" && "$VERSION" == *-* ]]; then
            TAG="prerelease"
          fi
          # Default to "latest" if no tag determined
          echo "value=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      - name: Publish package
        working-directory: ./dist
        run: npm publish --tag ${{ steps.tag.outputs.value }}
