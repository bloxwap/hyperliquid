name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # npm publishes via OIDC trusted publishing (no token here), which needs npm >= 11.5.1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          # Writes the registry auth line for NODE_AUTH_TOKEN (used while the package is
          # bootstrapped; trusted publishing takes over once configured on npmjs.com).
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Bun 1.4 (the Rust rewrite) ships only as canary; the `canary` tag moves with each build.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Emits dist/ with its own package.json whose exports point at the compiled .js/.d.ts files.
      - name: Build package
        run: bun run .dev/build/build.ts

      - name: Determine npm tag
        id: tag
        run: |
          # The emitted manifest inherits its version from the root package.json, so read it there.
          VERSION=$(jq -r .version package.json)
          # Extract tag (alpha, beta, rc) from version string if present
          TAG=$(echo "$VERSION" | sed -n 's/.*-\(alpha\|beta\|rc\).*/\1/p')
          # If no known tag found but version contains hyphen, use "prerelease"
          if [[ -z "$TAG" && "$VERSION" == *-* ]]; then
            TAG="prerelease"
          fi
          # Default to "latest" if no tag determined
          echo "value=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      - name: Publish package
        working-directory: ./dist
        # Scoped packages default to private access (paid); this SDK publishes public.
        run: npm publish --access public --tag ${{ steps.tag.outputs.value }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
