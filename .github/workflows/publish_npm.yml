name: Publish to npm

# npm trusted publishing requires a GitHub-hosted runner. This publishing job
# uses OIDC so the package can retain its 2FA requirement and disallow tokens.
# https://docs.npmjs.com/trusted-publishers/
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  security:
    # publish runs on ubuntu-latest; the scan runs on a mini (binaries are darwin_arm64). Adds the scan serially.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@90c5e7f20cef611a83ea7db51f9b85478d714fa6 # v1
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  publish:
    needs: security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # npm >= 11.5.1 detects the OIDC environment and uses the configured trusted publisher.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Emits packages/hyperliquid/dist/ (.js, .d.ts, and its publishable manifest), verified by loading it in Node.
      - name: Build package
        run: bun run build

      - name: Determine npm tag
        id: tag
        run: |
          # The private workspace root has no release version; the SDK owns the published version.
          # bun instead of jq; case instead of GNU sed `\|` / bash `[[`.
          VERSION=$(bun -e 'console.log(JSON.parse(await Bun.file("packages/hyperliquid/package.json").text()).version)')
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
            *-*) TAG=prerelease ;;
            *) TAG=latest ;;
          esac
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      # Scoped packages default to private access (paid); this SDK publishes public.
      # Trusted publishing automatically attaches provenance for this public package.
      - name: Publish package
        working-directory: ./packages/hyperliquid/dist
        run: npm publish --access public --tag ${{ steps.tag.outputs.value }}
