name: Publish to npm

# npm trusted publishing does not support self-hosted runners
# (https://docs.npmjs.com/trusted-publishers/). This job authenticates with the
# org-level NPM_TOKEN secret instead. That drops OIDC trusted publishing and
# automatic provenance.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]

    permissions:
      contents: read

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      # Job-level env cannot use the runner context on these Mac minis.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Token publish uses the same Node 24 / npm CLI surface as before.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # setup-bun writes ~/.bun, shared across runner instances on one Mac mini.
      - name: Install Bun canary into runner temp
        run: sh .github/scripts/setup-bun-isolated.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Emits packages/hyperliquid/dist/ (.js, .d.ts, and its publishable manifest), verified by loading it in Node.
      - name: Build package
        run: bun run build

      - name: Determine npm tag
        id: tag
        run: |
          # The private workspace root has no release version; the SDK owns the published version.
          # bun instead of jq; case instead of GNU sed `\|` / bash `[[`.
          VERSION=$(bun -e 'console.log(JSON.parse(await Bun.file("packages/hyperliquid/package.json").text()).version)')
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
            *-*) TAG=prerelease ;;
            *) TAG=latest ;;
          esac
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      # Fail closed before publish if the org-level secret is not shared with this repo.
      # Never print the token.
      - name: Verify npm token is present
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is missing. The org-level NPM_TOKEN secret must be shared with this repository." >&2
            exit 1
          fi

      # Scoped packages default to private access (paid); this SDK publishes public.
      # Token publish does not attach provenance (trusted publishing is unavailable here).
      - name: Publish package
        working-directory: ./packages/hyperliquid/dist
        run: npm publish --access public --tag ${{ steps.tag.outputs.value }}
