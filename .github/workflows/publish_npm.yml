name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]

    permissions:
      contents: read
      id-token: write

    steps:
      # Job-level env cannot use the runner context on these Mac minis.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # npm publishes via OIDC trusted publishing (no token here), which needs npm >= 11.5.1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Bun 1.4 (the Rust rewrite) ships only as canary; the `canary` tag moves with each build.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Emits packages/hyperliquid/dist/ (.js, .d.ts, and its publishable manifest), verified by loading it in Node.
      - name: Build package
        run: bun run build

      - name: Determine npm tag
        id: tag
        run: |
          # The private workspace root has no release version; the SDK owns the published version.
          # bun instead of jq; case instead of GNU sed `\|` / bash `[[`.
          VERSION=$(bun -e 'console.log(JSON.parse(await Bun.file("packages/hyperliquid/package.json").text()).version)')
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
            *-*) TAG=prerelease ;;
            *) TAG=latest ;;
          esac
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish package
        working-directory: ./packages/hyperliquid/dist
        # Scoped packages default to private access (paid); this SDK publishes public.
        run: npm publish --access public --tag ${{ steps.tag.outputs.value }}
