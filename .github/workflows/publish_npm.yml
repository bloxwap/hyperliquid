name: Publish to npm

# npm trusted publishing requires a GitHub-hosted runner. This publishing job
# uses OIDC so the package can retain its 2FA requirement and disallow tokens.
# https://docs.npmjs.com/trusted-publishers/
# The organization NPM_TOKEN stays as a transitional fallback until the npm
# Trusted Publisher for @bloxwap/hyperliquid is verified (same as chart).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    # The release scan runs on a mini (binaries are darwin_arm64).
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  build:
    needs: security
    runs-on: [self-hosted, macOS, ARM64]

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The build verifies the emitted package with Node before packing it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          package-manager-cache: false
      - name: Set up Bun (isolated)
        run: sh .github/scripts/setup-bun-isolated.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Emits packages/hyperliquid/dist/ (.js, .d.ts, and its publishable manifest), verified by loading it in Node.
      - name: Build package
        run: bun run build

      - name: Determine npm tag
        id: tag
        run: |
          # The private workspace root has no release version; the SDK owns the published version.
          # bun instead of jq; case instead of GNU sed `\|` / bash `[[`.
          VERSION=$(bun -e 'console.log(JSON.parse(await Bun.file("packages/hyperliquid/dist/package.json").text()).version)')
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
            *-*) TAG=prerelease ;;
            *) TAG=latest ;;
          esac
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pack package
        working-directory: ./packages/hyperliquid/dist
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release

    permissions:
      contents: read
      id-token: write

    steps:
      # npm >= 11.5.1 detects the OIDC environment and uses the configured trusted publisher.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      # Scoped packages default to private access (paid); this SDK publishes public.
      # --provenance attaches the GitHub Actions attestation. id-token: write above
      # is what trusted publishing uses; NODE_AUTH_TOKEN is only the fallback.
      - name: Publish package
        env:
          NPM_TAG: ${{ needs.build.outputs.tag }}
          # Transitional fallback: delete once the npm Trusted Publisher is verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/npm-package/*.tgz --access public --provenance --tag "$NPM_TAG"
