name: Tests (online)
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Bun 1.4 (the Rust rewrite) ships only as canary; the `canary` tag moves with each build.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `PRIVATE_KEY` unlocks the tests that place real testnet orders; without it those tests skip themselves.
      - name: bun test (with coverage)
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: bun test tests/ --coverage --coverage-reporter=lcov

      - name: Upload coverage to Coveralls.io
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2
        with:
          file: ./coverage/lcov.info
