name: Coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      # Skip doc-only PRs; SDK tests and performance scenarios do not read Markdown.
      # Non-PR events always run every heavy job, including reusable-workflow calls.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!CODEOWNERS'
              - '!.github/CODEOWNERS'

  coverage:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      # Job-level env cannot use the runner context on these Mac minis.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-bun writes ~/.bun, shared across runner instances on one Mac mini.
      - name: Install Bun canary into runner temp
        run: sh .github/scripts/setup-bun-isolated.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate coverage report with Bun
        working-directory: packages/hyperliquid
        env:
          HL_OFFLINE: "1"
        run: |
          bun test tests/ --coverage --coverage-reporter=lcov --coverage-dir=coverage
          test -s coverage/lcov.info
          # Bun writes SDK-relative source paths; coverage services need repository-relative paths.
          # Rewrite via $RUNNER_TEMP: BSD sed has no GNU `sed -i` in-place form.
          sed 's|^SF:|SF:packages/hyperliquid/|' coverage/lcov.info > "$RUNNER_TEMP/lcov.info"
          mv "$RUNNER_TEMP/lcov.info" coverage/lcov.info

      # codecov-action requires host `gpg` for CLI integrity. These Mac minis do
      # not have it; same pinned CLI + SHA256 check as lychee, same upload flags.
      - name: Upload coverage reports to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: sh .github/scripts/codecov-upload.sh ./packages/hyperliquid/coverage/lcov.info
